// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        // maven.google.com mirrors the same artifacts as the google()
        // shorthand (which resolves to dl.google.com/dl/android/maven2) —
        // used explicitly here because some sandboxed/proxied build
        // environments allow the former host but not the latter.
        maven { url 'https://maven.google.com' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // google-services is only applied by app/build.gradle when a
        // google-services.json (Firebase) is present — it isn't here, so
        // this classpath isn't needed and is skipped to avoid an extra,
        // unused dependency resolution.

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url 'https://maven.google.com' }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
